<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Source for site/assets/og-image.png, the 1200x630 social preview card (WhatsApp, LinkedIn, email).
  Rebuild (from the Portfolio folder, needs a network connection for the fonts):
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
      --force-device-scale-factor=1 --window-size=1200,630 --virtual-time-budget=10000 \
      --screenshot=site/assets/og-image.png tools/og-image.html
  Same hard rules as the site: no phone number, no unapproved names or figures.
-->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Onest:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#08080a;color:#f3f1ea;font-family:"Onest",sans-serif;-webkit-font-smoothing:antialiased}
.card{position:relative;width:1200px;height:630px;padding:64px 72px}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.roles{font-family:"Anton",sans-serif;font-size:34px;line-height:1.08;text-transform:uppercase;letter-spacing:-.005em}
.loc{font-size:17px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:#807f78;text-align:right;line-height:1.6}
.loc b{font-weight:500;color:#f3f1ea}
.loc b::before{content:"";display:inline-block;width:10px;height:10px;margin-right:12px;border-radius:50%;background:#ff3b1d;vertical-align:.08em}
.name{position:absolute;left:66px;bottom:118px;font-family:"Anton",sans-serif;font-size:236px;line-height:.86;text-transform:uppercase;color:#ff3b1d;letter-spacing:-.01em}
.foot{position:absolute;left:72px;right:72px;bottom:56px;display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid rgba(243,241,234,.18);padding-top:22px}
.tag{font-size:21px;color:#b9b7af}
.url{font-size:19px;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="roles">Backend<br>Cloud<br>AI Systems</div>
    <div class="loc"><b>Ahmedabad, IST</b><br>Remote</div>
  </div>
  <div class="name">Het Shah</div>
  <div class="foot">
    <span class="tag">Backend and AI systems engineer</span>
    <span class="url">hetshahbuilds.in</span>
  </div>
</div>
</body>
</html>
